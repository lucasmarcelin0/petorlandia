name: Authorization Gate

# Trava rápida antes do ar (~1 min). É o único teste que segura a publicação:
# autorização (dados de clínica e tutores), migrations com uma cabeça só e o
# app montando como o gunicorn monta. A suíte completa roda depois do deploy
# (tests.yml) e avisa se algo quebrou.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  statuses: write

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Preflight (migrations, imports, Procfile)
        run: python scripts/preflight_deploy.py

      - name: Static route security gate (new sensitive routes)
        run: |
          python scripts/check_route_security.py

      - name: Run authorization integration suite (merge gate)
        run: |
          pytest -q tests/test_sensitive_endpoints_authorization.py tests/test_security_authorization.py tests/test_clinic_staff_permissions.py

      - name: Registrar arvore testada
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          gh api "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state=success -f context=arvore-testada/authorization-tests -f description="$tree" > /dev/null
          echo "Arvore testada: $tree"
