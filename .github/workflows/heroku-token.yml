# Confere toda semana se o token do Heroku (secret HEROKU_API_KEY) funciona.
#
# Existe porque o token expirava em silencio e so se descobria na hora de
# publicar. Quando ele e recusado, ou expira em menos de 15 dias, esta
# execucao falha com o passo a passo para trocar -- e o GitHub manda e-mail
# sobre a falha. Nao publica nada e nao le dados de producao.
name: Conferir token do Heroku

on:
  schedule:
    # Segundas, 08:17 em Brasilia (11:17 UTC).
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Conferir token
        run: python scripts/check_heroku_token.py --avisar-dias 15
