# Mostra as ultimas linhas de log do app em producao, na saida da execucao.
#
# Existe porque investigar um erro que so acontece em producao exigia o CLI do
# Heroku -- que nao existe no celular nem num runner. Sem isto, a alternativa
# era adivinhar.
#
# So le: nao publica, nao escreve no repositorio, nao toca em producao.
name: Logs do Heroku

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Filtrar por (regex). Ex.: animal.*photo"
        required: false
        default: ""
      linhas:
        description: "Quantas linhas trazer"
        required: false
        default: "500"
      app:
        description: "App do Heroku (vazio = descobre sozinho pelo token)"
        required: false
        default: ""
  # Segundo caminho para o mesmo job: um push nesta branch vale como o clique
  # em "Run workflow". Existe porque quem nao tem esse clique (um agente, ou
  # alguem so com o celular na mao) ficava sem caminho nenhum para investigar
  # producao. Os parametros vem de .github/disparo/logs.json, na propria
  # branch. Quem pode empurrar a branch ja podia rodar o workflow: a permissao
  # e a mesma de sempre.
  push:
    branches:
      - disparo/logs-heroku

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    # Apagar a branch tambem gera um evento de `push`. Ler log por engano custa
    # pouco, mas o job nao tem por que rodar numa faxina de branch.
    if: ${{ github.event_name != 'push' || github.event.deleted != true }}
    timeout-minutes: 10
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
    steps:
      - name: Conferir credenciais
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "Falta o secret HEROKU_API_KEY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolver app do Heroku
        id: app
        env:
          NOME_PEDIDO: ${{ inputs.app || secrets.HEROKU_APP_NAME }}
          NOME_REPO: ${{ github.event.repository.name }}
        run: |
          nome=$(python scripts/resolve_heroku_app.py --name "$NOME_PEDIDO" --repo "$NOME_REPO")
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "Lendo logs de: $nome"

      # No `workflow_dispatch` os parametros vem do formulario; no `push` vem do
      # arquivo de pedido. Daqui para baixo o job nao sabe mais a diferenca --
      # e os dois passam pela mesma validacao, que antes so o arquivo tinha.
      #
      # Tudo que veio de fora entra por variavel de ambiente, nunca interpolado
      # dentro do texto do script: `${{ }}` e substituicao textual, entao um
      # filtro com aspas ou `$(...)` viraria comando em vez de argumento.
      - name: Parametros do pedido
        id: pedido
        env:
          ENTRADA_FILTRO: ${{ inputs.filtro }}
          ENTRADA_LINHAS: ${{ inputs.linhas }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            python scripts/ler_pedido_logs.py --do-ambiente
          else
            python scripts/ler_pedido_logs.py --arquivo .github/disparo/logs.json
          fi

      - name: Ultimas linhas
        env:
          APP: ${{ steps.app.outputs.nome }}
          LINHAS: ${{ steps.pedido.outputs.linhas }}
          FILTRO: ${{ steps.pedido.outputs.filtro }}
        run: |
          python scripts/heroku_logs.py \
            --app "$APP" \
            --lines "$LINHAS" \
            --filtro "$FILTRO"
