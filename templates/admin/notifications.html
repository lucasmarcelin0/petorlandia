{% extends "layout.html" %}

{% block main %}
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h1 class="h3 mb-1">Central de notificações</h1>
      <p class="text-muted mb-0">Acompanhe alertas operacionais, confirme a leitura e encerre pendências resolvidas.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{{ url_for('admin_protocol_proposals') }}"><i class="fas fa-notes-medical me-1"></i> Sugestões clínicas</a>
      <a class="btn btn-outline-secondary" href="{{ url_for('painel_admin.index') }}"><i class="fas fa-arrow-left me-1"></i> Painel</a>
    </div>
  </div>

  {% include "admin/_notifications_panel.html" %}
</div>

<script>
(() => {
  const headers = {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'};

  async function loadPanel(url, pushHistory = false) {
    const currentPanel = document.getElementById('admin-notifications-panel');
    if (!currentPanel) return;
    currentPanel.classList.add('opacity-50');
    currentPanel.setAttribute('aria-busy', 'true');
    try {
      const response = await fetch(url, {headers});
      if (!response.ok) throw new Error('Falha ao carregar notificações.');
      const payload = await response.json();
      const wrapper = document.createElement('div');
      wrapper.innerHTML = payload.html;
      currentPanel.replaceWith(wrapper.firstElementChild);
      if (pushHistory) history.pushState({}, '', payload.url || url);
    } catch (error) {
      currentPanel.classList.remove('opacity-50');
      currentPanel.removeAttribute('aria-busy');
      const feedback = document.createElement('div');
      feedback.className = 'alert alert-danger mb-3';
      feedback.textContent = 'Não foi possível atualizar as notificações. Tente novamente.';
      currentPanel.prepend(feedback);
    }
  }

  document.addEventListener('submit', async (event) => {
    const filter = event.target.closest('[data-notifications-filter]');
    if (filter) {
      event.preventDefault();
      const url = `${filter.action}?${new URLSearchParams(new FormData(filter))}`;
      await loadPanel(url, true);
      return;
    }

    const action = event.target.closest('[data-notification-action]');
    if (!action) return;
    event.preventDefault();
    const button = action.querySelector('button[type="submit"]');
    if (button) button.disabled = true;
    try {
      const response = await fetch(action.action, {method: 'POST', headers, body: new FormData(action)});
      if (!response.ok) throw new Error('Falha ao atualizar a notificação.');
      await loadPanel(window.location.href);
    } catch (error) {
      if (button) button.disabled = false;
      const panel = document.getElementById('admin-notifications-panel');
      const feedback = document.createElement('div');
      feedback.className = 'alert alert-danger mb-3';
      feedback.textContent = 'Não foi possível atualizar a notificação. Tente novamente.';
      panel?.prepend(feedback);
    }
  });

  document.addEventListener('click', (event) => {
    const link = event.target.closest('[data-notifications-page]');
    if (!link) return;
    event.preventDefault();
    loadPanel(link.href, true);
  });

  window.addEventListener('popstate', () => loadPanel(window.location.href));
})();
</script>
{% endblock %}
