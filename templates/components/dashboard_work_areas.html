{% for workspace in user_experience.workspaces %}
<section class="dashboard-work-area workspace-band" data-dashboard-area="{{ workspace.key }}" aria-labelledby="workspace-{{ workspace.key }}">
  <h2 id="workspace-{{ workspace.key }}" class="h5"><i class="fa-solid {{ workspace.icon }} me-2" aria-hidden="true"></i>{{ workspace.label }}</h2>
  <div class="workspace-actions">
    {% for action in workspace.actions %}
    <a href="{{ action.url }}" class="btn {{ 'btn-primary' if loop.first else 'btn-outline-secondary' }}" data-cta="workspace_{{ workspace.key }}_{{ loop.index }}">
      <i class="fa-solid {{ action.icon }} me-2" aria-hidden="true"></i>{{ action.label }}
    </a>
    {% endfor %}
  </div>
</section>
{% endfor %}
