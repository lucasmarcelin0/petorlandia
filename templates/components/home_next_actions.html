{% if next_actions %}
<section class="next-actions workspace-band" aria-labelledby="next-actions-title">
  <h2 id="next-actions-title" class="h5">Precisa de atenção</h2>
  <ul class="next-actions-list">
    {% for action in next_actions %}
    <li>
      <a href="{{ action.url }}" class="next-action next-action--{{ action.tone }}" data-cta="home_next_action">
        <i class="fa-solid {{ action.icon }}" aria-hidden="true"></i>
        <span><strong>{{ action.label }}</strong><small>{{ action.detail }}</small></span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
