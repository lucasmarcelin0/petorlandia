<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Algo não saiu como esperado — PetOrlândia</title>
  <style>
    *{box-sizing:border-box}body{background:#f5f7fa;color:#172638;font-family:system-ui,-apple-system,sans-serif;margin:0}
    main{align-items:center;display:flex;min-height:100vh;padding:24px}
    article{background:#fff;border:1px solid #dfe5ec;border-radius:24px;box-shadow:0 24px 60px -48px #172638;margin:auto;max-width:680px;padding:clamp(28px,6vw,56px);text-align:center}
    .brand{color:#176c47;font-weight:800}.code{color:#176c47;display:block;font-size:clamp(52px,14vw,100px);font-weight:850;letter-spacing:-.07em;line-height:1}
    h1{font-size:clamp(25px,5vw,38px);margin:18px 0 10px}p{color:#536579;line-height:1.65}
    nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0}
    a{border:1px solid #176c47;border-radius:999px;color:#176c47;font-weight:700;padding:12px 18px;text-decoration:none}
    a:first-child{background:#176c47;color:#fff}.ref{font-size:12px;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main>
    <article>
      <div class="brand">PetOrlândia</div>
      <span class="code">500</span>
      <h1>Algo não saiu como esperado</h1>
      <p>A falha foi registrada. Tente novamente; se persistir, envie o código abaixo ao suporte.</p>
      <nav aria-label="Opções de recuperação">
        <a href="/">Voltar ao início</a>
        <a href="/support">Falar com o suporte</a>
      </nav>
      <p class="ref">Código de referência: {{ g.request_id }}</p>
    </article>
  </main>
</body>
</html>
