{# Inserida em toda página HTML enquanto o administrador usa o "Ver como" (request_hooks._faixa_ver_como). #}
<style>
  body { padding-bottom: 64px !important; }
  .ver-como-faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483000; display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center; gap: .25rem .75rem; padding: .55rem 1rem; background: #7a2e00; color: #fff;
    font: 600 .9rem/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; box-shadow: 0 -2px 10px rgba(0,0,0,.25); }
  .ver-como-faixa a { color: #7a2e00; background: #fff; border-radius: 999px; padding: .3rem .85rem; text-decoration: none; white-space: nowrap; }
  .ver-como-faixa a:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  @media print { .ver-como-faixa { display: none; } body { padding-bottom: 0 !important; } }
</style>
<div class="ver-como-faixa" role="status" data-ver-como>
  <span><i class="fa fa-eye" aria-hidden="true"></i> Vendo como {{ ver_como.alvo.name or ver_como.alvo.email }} · somente leitura · até {{ ver_como.ate }}</span>
  <a href="{{ url_for('ver_como_sair') }}">Voltar à minha conta</a>
</div>
