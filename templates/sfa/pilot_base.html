<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>{% block title %}Piloto dos formulários SFA{% endblock %}</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183a40;background:#f3f7f7;font-size:17px}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:24px 18px 70px}h1{font-size:2rem;line-height:1.15}h2{font-size:1.3rem;margin-top:0}h3{font-size:1rem}p{line-height:1.6}a{color:#086674}nav{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}section{background:white;border:1px solid #d2dfe1;border-radius:14px;padding:22px;margin:22px 0}.question{margin:24px 0}label,legend{font-weight:600;line-height:1.5}fieldset{border:0;padding:0;margin:0;min-width:0}input,textarea,select,button{font:inherit}input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;padding:12px;border:1px solid #849ea4;border-radius:7px;margin-top:7px;background:white}textarea{min-height:95px}input[type=checkbox],input[type=radio]{min-width:20px;min-height:20px;margin:2px 8px 0 0}.choice{display:flex;align-items:flex-start;font-weight:400;padding:10px 0}.help{font-size:.92rem;color:#4c676e;line-height:1.5;margin:8px 0}button,.button{display:inline-block;background:#086674;color:white;border:0;border-radius:8px;padding:13px 18px;text-decoration:none;cursor:pointer}button.secondary{background:#e4eff0;color:#183a40}.error{color:#9d211c;border:2px solid #9d211c;padding:15px}.eyebrow{color:#086674;font-size:.8rem;font-weight:750;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.workplace{border-top:1px solid #cbdade;padding:16px 0}.workplace:first-child{border-top:0}[hidden]{display:none!important}.field-number{color:#607980;font-size:.8rem}summary{cursor:pointer}footer{font-size:.85rem;color:#4c676e} @media(max-width:520px){.grid{grid-template-columns:1fr}section{padding:16px}h1{font-size:1.7rem}}@media print{nav,button{display:none}main{max-width:none}section{border:0;padding:0}.question{break-inside:avoid}}
</style></head><body><main><div class="eyebrow">SFA · TESTE DE USABILIDADE</div>
{% block content %}{% endblock %}
<footer>Este espaço não é monitorado para atendimento de saúde. Não aguarde resposta do formulário para procurar atendimento se precisar.</footer>
</main>{% block scripts %}{% endblock %}</body></html>
